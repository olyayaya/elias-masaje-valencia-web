# Netlify build + headers config.
#
# SPA fallback rewrite (/*  /index.html  200) lives in public/_redirects so
# Vite picks it up at build time and ships it into dist/. Keep redirects
# there, keep cache headers here.

[build]
  publish = "dist"
  command = "npm run build"

# Serverless functions (e.g. ga4-report — live Google Analytics metrics for the
# dashboard). Reachable at /.netlify/functions/<name>.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# index.html must not be cached — it's the entry point that references the
# fingerprinted /assets/* chunks and the favicon ?v= cache-buster.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite fingerprints everything in /assets/*, so they're safe to cache for
# a year and mark immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
