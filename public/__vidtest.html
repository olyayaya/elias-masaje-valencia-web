<!doctype html><html><body><input id="f" type="file"><script type="module">
window.run = async (file) => {
  const eng = await import('/src/lib/video-ffmpeg.ts');
  const caps = await eng.probeEncoders();
  const meta = { width: 464, height: 848, duration: 3, size: file.size };
  const out = await eng.convertVideo(file, { format:'mp4', quality:'balanced', resolution:'original', meta, caps }, {});
  return { caps, size: out.size };
};
</script></body></html>
